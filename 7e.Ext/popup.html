<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7e.Ext</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <span class="logo-mark">7e</span>
      <span class="logo-dot">.</span>
      <span class="logo-ext">Ext</span>
    </div>
    <p class="tagline">Your web, one click away</p>
  </header>

  <!-- Site list -->
  <main>
    <ul id="site-list" class="site-list">
      <!-- Populated by popup.js -->
    </ul>

    <div id="empty-state" class="empty-state" hidden>
      <p>No websites added yet.</p>
      <p class="hint">Open <code>websites.js</code> and add your links.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <span>Edit <code>websites.js</code> to add your links</span>
  </footer>

  <script src="websites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
