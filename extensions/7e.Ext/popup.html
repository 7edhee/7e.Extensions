<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7e Web Launcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">7e.Ext</p>
        <h1>My websites</h1>
      </div>
      <span class="badge" id="siteCount">0 sites</span>
    </header>

    <section id="websiteList" class="website-list" aria-live="polite"></section>

    <section id="emptyState" class="empty-state" hidden>
      <div class="empty-icon">+</div>
      <h2>No websites yet</h2>
      <p>Open <strong>websites.js</strong> and add your links to the list.</p>
      <code>{ name: "My site", url: "https://example.com" }</code>
    </section>

    <footer class="footer">
      <span>Edit websites.js to customize</span>
      <span class="version">v1.0.0</span>
    </footer>
  </main>
  <script src="websites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
